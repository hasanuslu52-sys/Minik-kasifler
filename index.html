<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131f">
<title>🚀 Minik Kaşifler</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0a0d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding:14px 14px 95px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin:5px 0 16px}
.stars{border:1px solid #4a4356;border-radius:22px;padding:7px 12px;background:#141118}
.hero{background:linear-gradient(135deg,#30274b,#473b79);border:1px solid #8172aa;border-radius:20px;padding:18px;margin-bottom:12px}
.hero small{color:#d9d2ec}.hero h1{font-size:25px;margin:6px 0}.hero p{color:#ddd5e8;margin:4px 0 14px}
button{border:0;color:#fff;background:#43358c;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}
.primary{width:100%;background:#4a3bb0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 18px}
.card{border:1px solid #302b35;background:#0d0c0f;border-radius:16px;padding:15px;cursor:pointer}.card:active{transform:scale(.98)}
.section{display:flex;justify-content:space-between;align-items:center;margin:18px 3px 8px;font-weight:800}.muted{color:#aaa;font-size:13px}
.route,.story{border:1px solid #302b35;background:#0d0c0f;border-radius:16px;padding:14px;margin-bottom:9px;cursor:pointer}
.route strong,.story strong{display:block;margin-bottom:3px}.emoji{font-size:26px;float:left;margin-right:12px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);background:#0d0c10;border:1px solid #39323f;border-radius:20px 20px 0 0;padding:8px;z-index:10}
nav button{background:transparent;padding:9px 4px;font-size:12px}.active{background:#211b35!important}
.gamebox,.storybox,.parentbox{border:1px solid #39323f;border-radius:20px;background:#100e12;padding:20px}
.question{font-size:24px;font-weight:900;text-align:center;margin:15px 0 20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:80px;font-size:20px;background:#18151c;border:1px solid #403a48}.feedback{text-align:center;min-height:35px;margin-top:15px;font-weight:800}
.back{background:#201b26;margin-bottom:12px}.bigemoji{text-align:center;font-size:70px;margin:8px}.progress{height:8px;background:#29242e;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#8d76ff}
.list{display:grid;gap:10px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .card b{font-size:25px;display:block}
.pin{max-width:300px;margin:30px auto;text-align:center}.pin input{width:100%;padding:13px;border-radius:12px;border:1px solid #48404f;background:#151218;color:white;text-align:center;font-size:20px}
.badge{display:inline-block;border-radius:20px;padding:4px 9px;background:#242018;color:#ffd84d;font-size:11px}
@media(max-width:500px){.app{padding-top:8px}.hero h1{font-size:23px}.answers{grid-template-columns:1fr}.cards{gap:8px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<nav id="nav"></nav>
<script>
const KEY="minikKasiflerV2";
let state=JSON.parse(localStorage.getItem(KEY)||'{"stars":0,"completed":0,"minutes":0,"games":0,"story":0}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const app=document.getElementById("app"), nav=document.getElementById("nav");
const games=[
 {id:"color",icon:"🎨",name:"Rengi Bul",desc:"Doğru rengi seç.",q:"Hangisi kırmızı?",a:["🔴 Kırmızı","🔵 Mavi","🟢 Yeşil","🟡 Sarı"],ok:0},
 {id:"number",icon:"🔢",name:"Sayıyı Bul",desc:"Kaç tane var?",q:"🍎🍎🍎 kaç tane?",a:["2","3","4","5"],ok:1},
 {id:"shape",icon:"🔷",name:"Şekli Bul",desc:"Doğru şekli seç.",q:"Hangisi üçgen?",a:["🔵","🔺","🟩","⭐"],ok:1},
 {id:"animal",icon:"🐾",name:"Hayvanı Bul",desc:"Hangi hayvan?",q:"Hangisi bir kedi?",a:["🐶","🐱","🐰","🦁"],ok:1},
 {id:"fruit",icon:"🍎",name:"Meyveleri Say",desc:"Kaç meyve görüyorsun?",q:"🍎🍐🍎🍌 kaç meyve?",a:["2","3","4","5"],ok:2},
 {id:"opposite",icon:"↕️",name:"Zıt Kavramlar",desc:"Büyüğü ve küçüğü bul.",q:"Hangisi büyük?",a:["🐭","🐘","🐜","🐞"],ok:1}
];
const stories=[
 {icon:"⭐",name:"Minik Kaşif ve Kayıp Yıldız",age:"4–6 yaş",text:"Minik Kaşif gökyüzünde parlayan küçük bir yıldız gördü. Yıldız yolunu kaybetmişti. Kaşif onu gökyüzüne geri götürmek için renkli bir maceraya çıktı. Önce gökkuşağının altından geçti, sonra ay ışığını takip etti. Yıldız yerine kavuşunca gökyüzü ışıl ışıl oldu. Minik Kaşif gülümsedi: Her küçük yardım büyük bir mutluluk getirir."},
 {icon:"🌈",name:"Gökkuşağının Sırrı",age:"3–6 yaş",text:"Yağmurdan sonra gökyüzünde rengârenk bir gökkuşağı belirdi. Minik Kaşif renkleri tek tek saydı: kırmızı, turuncu, sarı, yeşil, mavi, lacivert ve mor. Gökkuşağı ona doğadaki her rengin özel olduğunu öğretti."},
 {icon:"🐰",name:"Cesur Tavşan Lila",age:"4–7 yaş",text:"Lila ormanda tek başına yürürken küçük bir ses duydu. Korkmak yerine derin bir nefes aldı ve sese doğru ilerledi. Minik bir kuş yuvasından düşmüştü. Lila yardım çağırdı ve kuş güvenle yuvasına döndü. Cesaret, korkmamak değil; doğru şeyi yapmaya çalışmaktır."}
];
function layout(title,content){app.innerHTML=`<header><span>🚀 Minik Kaşifler</span><span class="stars">⭐ ${state.stars}</span></header>${content}`;nav.innerHTML=`
<button onclick="home()">🏠<br>Ana Sayfa</button><button onclick="gamesPage()">🎮<br>Oyunlar</button>
<button onclick="storiesPage()">📚<br>Hikâyeler</button><button onclick="parentPage()">👨‍👩‍👧<br>Ebeveyn</button>`}
function home(){layout("",`
<section class="hero"><small>2–8 yaş · Güvenli keşif dünyası</small><h1>Keşfet · Öğren · Eğlen!</h1><p>Her gün küçük bir görev, eğlenceli bir oyun ve sıcacık bir hikâye.</p><button class="primary" onclick="daily()">⭐ Bugünün keşfine başla</button></section>
<div class="cards"><div class="card"><b>${state.stars}</b><span class="muted">Topladığın yıldız</span></div><div class="card"><b>${state.completed}</b><span class="muted">Tamamlanan keşif</span></div></div>
<div class="section">🎯 Bugünün rotası <span class="muted">10–15 dk</span></div>
<div class="route" onclick="play('color')"><span class="emoji">🌈</span><strong>Renkleri Keşfet</strong><span class="muted">3 kısa soru + mini görev</span></div>
<div class="section">📖 Yeni hikâye <span class="badge">Tümü</span></div>
<div class="story" onclick="story(0)"><span class="emoji">⭐</span><strong>Minik Kaşif ve Kayıp Yıldız</strong><span class="muted">Sesli hikâye · 4–6 yaş · 4 dk</span></div>`)}
function gamesPage(){layout("",`<div class="section">🎮 Oyunlar <span class="muted">Doğru cevap = ⭐</span></div><div class="cards">${games.map(g=>`<div class="card" onclick="play('${g.id}')"><div class="bigemoji">${g.icon}</div><b>${g.name}</b><span class="muted">${g.desc}</span><br><span class="badge">Kolay</span></div>`).join("")}</div>`)}
function play(id){let g=games.find(x=>x.id===id);let i=0,score=0;
function render(){app.innerHTML=`<header><span>🚀 Minik Kaşifler</span><span class="stars">⭐ ${state.stars}</span></header><button class="back" onclick="gamesPage()">← Oyunlara dön</button><div class="gamebox"><div class="muted">Soru ${i+1} / 3</div><div class="progress"><i style="width:${(i/3)*100}%"></i></div><div class="bigemoji">${g.icon}</div><div class="question">${g.q}</div><div class="answers">${g.a.map((x,n)=>`<button class="answer" onclick="answer(${n})">${x}</button>`).join("")}</div><div id="feedback" class="feedback"></div></div>`}
window.answer=(n)=>{let f=document.getElementById("feedback"); if(n===g.ok){score++;state.stars++;save();f.textContent="🎉 Harika! +1 yıldız";f.style.color="#ffd84d"}else{f.textContent="💡 Bir daha düşün!";}setTimeout(()=>{i++;if(i>=3){state.completed++;state.games++;save();finish(score)}else{g={...g,q:variants(g.id,i).q,a:variants(g.id,i).a,ok:variants(g.id,i).ok};render()}},700)}
function variants(id,i){const base=games.find(x=>x.id===id);const v={color:[["Hangisi sarı?",["🔴","🔵","🟢","🟡"],3],["Hangisi mavi?",["🟢","🔵","🟡","🔴"],1]],number:[["🍎🍎 kaç tane?",["1","2","3","4"],1],["🍓🍓🍓🍓 kaç tane?",["2","3","4","5"],2]],shape:[["Hangisi daire?",["🔺","🟩","🔵","⭐"],2],["Hangisi kare?",["🔵","🔺","🟩","⭐"],2]],animal:[["Hangisi tavşan?",["🐶","🐱","🐰","🦁"],2],["Hangisi köpek?",["🐶","🐱","🐰","🐭"],0]],fruit:[["🍎🍎🍐 kaç meyve?",["2","3","4","5"],1],["🍌🍌🍎🍐🍊 kaç meyve?",["3","4","5","6"],2]],opposite:[["Hangisi küçük?",["🐘","🐭","🦒","🐋"],1],["Hangisi uzun?",["🐜","🦒","🐭","🐞"],1]]};let x=v[id][i-1]||[base.q,base.a,base.ok];return {q:x[0],a:x[1],ok:x[2]}}
function finish(score){app.innerHTML=`<header><span>🚀 Minik Kaşifler</span><span class="stars">⭐ ${state.stars}</span></header><div class="gamebox" style="text-align:center"><div class="bigemoji">🏆</div><h1>Harika iş!</h1><p>${score}/3 doğru cevap verdin.</p><p>⭐ ${score} yıldız kazandın!</p><button class="primary" onclick="gamesPage()">🎮 Başka oyun oyna</button><br><br><button onclick="home()">🏠 Ana Sayfa</button></div>`}
function storiesPage(){layout("",`<div class="section">📚 Hikâyeler <span class="muted">Oku veya dinle</span></div><div class="list">${stories.map((s,i)=>`<div class="story" onclick="story(${i})"><span class="emoji">${s.icon}</span><strong>${s.name}</strong><span class="muted">${s.age} · 4 dk</span></div>`).join("")}</div>`)}
function story(i){let s=stories[i];layout("",`<button class="back" onclick="storiesPage()">← Hikâyelere dön</button><div class="storybox"><div class="bigemoji">${s.icon}</div><h2>${s.name}</h2><span class="badge">${s.age}</span><p style="font-size:18px;line-height:1.7">${s.text}</p><button class="primary" onclick="speakStory()">🔊 Sesli dinle</button><br><br><button onclick="finishStory()">⭐ Hikâyeyi tamamladım</button></div>`);
window.speakStory=()=>{if("speechSynthesis" in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s.text);u.lang="tr-TR";u.rate=.9;speechSynthesis.speak(u)}};
window.finishStory=()=>{state.stars++;state.story++;state.completed++;save();alert("⭐ Hikâye tamamlandı! 1 yıldız kazandın.");storiesPage()}}
function parentPage(){let ok=sessionStorage.getItem("parentOK");if(!ok){layout("",`<div class="parentbox pin"><h2>🔒 Ebeveyn Alanı</h2><p class="muted">Devam etmek için PIN girin.</p><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><br><br><button class="primary" onclick="checkPin()">Giriş</button><p class="muted">Varsayılan PIN: 1234</p></div>`);return}
layout("",`<div class="section">👨‍👩‍👧 Ebeveyn Alanı</div><div class="parentbox"><p class="muted">Bugünkü kullanım</p><h2>${state.minutes} dk</h2><div class="progress"><i style="width:${Math.min(100,state.minutes/20*100)}%"></i></div><p class="muted">Önerilen günlük süre: 20 dk</p><div class="stat"><div class="card">⭐<b>${state.stars}</b><span class="muted">Yıldız</span></div><div class="card">🎯<b>${state.completed}</b><span class="muted">Keşif</span></div></div><br><button onclick="resetProgress()">İlerlemeyi sıfırla</button></div>`)}
function checkPin(){if(document.getElementById("pin").value==="1234"){sessionStorage.setItem("parentOK","1");parentPage()}else alert("PIN yanlış.")}function resetProgress(){if(confirm("Tüm ilerleme silinsin mi?")){state={stars:0,completed:0,minutes:0,games:0,story:0};save();parentPage()}}
function daily(){play("color")}
home();
</script>
</body></html>
